name: Publish UK vacancy pool
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: vacancy-pool-publication
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.feed.outputs.configured }}
    steps:
      - name: Check feed configuration
        id: feed
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -n "$REED_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Reed secret is available. Collection and publication must still succeed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '### Vacancy feed was not published' >> "$GITHUB_STEP_SUMMARY"
            echo 'REED_API_KEY is unavailable. Add it as a repository Actions secret in Settings → Secrets and variables → Actions, then run this workflow again. A repository variable or a secret in another environment will not be read by this check. The current site is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            if [ "$TRIGGER" = 'workflow_dispatch' ]; then
              echo '::error::REED_API_KEY is unavailable. No vacancies were collected or published.'
              exit 1
            fi
            echo '::warning::Reed is not configured. Vacancy publication was skipped.'
          fi
  publish:
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Refresh public listings
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: node scripts/refresh-vacancies.mjs
      - name: Report collected listings
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pool = JSON.parse(readFileSync('data/vacancies.json', 'utf8'));
          const summary = [
            '### Reed collection result',
            `Collected **${pool.jobs.length} listings** at ${pool.fetchedAt}.`,
            pool.partial ? 'Some source searches failed; coverage is reduced.' : 'All configured source searches completed.',
            pool.jobs.length
              ? 'On the site, open More tools → Suggested vacancies. Role and location filters can reduce the number shown.'
              : 'The source returned no usable, unexpired listings. A green deployment will not make jobs appear; inspect the collection result before retrying.',
            'Collection is complete. The deployment step below must also succeed before these listings are live.'
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n\n') + '\n');
          if (!pool.jobs.length) console.log('::warning::The collected vacancy pool is empty.');
          NODE
      - name: Stage only public website files
        run: |
          mkdir _site
          cp index.html styles.css .nojekyll README.md _site/
          cp -R src vendor research data docs feedback _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Publish the site and shared pool
        id: deployment
        uses: actions/deploy-pages@v4
